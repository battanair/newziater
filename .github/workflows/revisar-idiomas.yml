name: Revisar idiomas

# Arranca la web compilada y hace capturas y comprobaciones en español e inglés.
on:
  push:
    branches: [ingles]
  workflow_dispatch:
    inputs:
      paginas:
        description: "Direcciones separadas por comas"
        required: false
        default: "/,/en,/en/obras,/en/personas,/en/companias,/en/salas,/en/cartelera,/en/colaboradores,/en/buscar?q=vagos,/en/obra/PCdBR7E4UAdtuq0kEW9u,/obra/PCdBR7E4UAdtuq0kEW9u,/en/persona/3RCVwO2G7iX53oPpBXxK,/en/compania/zbNecwtuPe3iTNw6YGMX,/en/politica-de-privacidad,/en/terminos-de-uso,/en/politica-de-cookies,/en/aviso-legal,/en/contacto,/en/login,/en/signup,/en/no-existe,/no-existe,/es/obras,/en/panel"

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx next build --no-lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm install --no-save --no-fund --no-audit playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 2; done
          curl -s -o /dev/null -w "cabecera / → %{http_code}\n" http://localhost:3000/
          curl -s -o /dev/null -w "/es/obras → %{http_code} %{redirect_url}\n" http://localhost:3000/es/obras
          curl -s -o /dev/null -w "/obras con cookie en → %{http_code} %{redirect_url}\n" -b "ziater-idioma=en" http://localhost:3000/obras
          curl -s http://localhost:3000/sitemap/0.xml | head -c 1500; echo
          node scripts/revisar-idiomas.mjs
        env:
          PAGINAS: ${{ inputs.paginas || '/,/en,/en/obras,/en/personas,/en/companias,/en/salas,/en/cartelera,/en/colaboradores,/en/buscar?q=vagos,/en/obra/PCdBR7E4UAdtuq0kEW9u,/obra/PCdBR7E4UAdtuq0kEW9u,/en/persona/3RCVwO2G7iX53oPpBXxK,/en/compania/zbNecwtuPe3iTNw6YGMX,/en/politica-de-privacidad,/en/terminos-de-uso,/en/politica-de-cookies,/en/aviso-legal,/en/contacto,/en/login,/en/signup,/en/no-existe,/no-existe,/es/obras,/en/panel' }}
      # Las capturas se suben a una rama aparte (capturas-revision) para poder verlas; se borra al terminar la revisión
      - run: |
          cd revision
          git init -q && git checkout -q -b capturas-revision
          git config user.name "revision" && git config user.email "revision@users.noreply.github.com"
          git add -A && git commit -qm "Capturas de la revisión de idiomas"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas-revision
